<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Learnify</title>
    <style>
        /* General Body Style */
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #f4f7fc;
        }

        /* Main Heading Style */
        h1 {
            color: #2c3e50;
            font-size: 3rem;
            margin-bottom: 10px;
        }

        /* Tagline Style */
        .tagline {
            font-style: italic;
            color: #e74c3c;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        /* Image Styling */
        img {
            width: 40%;
            max-width: 400px;
            margin: 20px 0;
            border-radius: 10px;
        }

        /* Button Styling */
        button {
            padding: 12px 25px;
            font-size: 18px;
            background-color: #062d46;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 8px;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #2980b9;
        }

        /* Footer Styling */
        footer {
            margin-top: 40px;
            font-size: 0.9rem;
            color: #7f8c8d;
        }
    </style>
</head>
<body>
    <h1>Welcome to <span style="color: #ff6347;">Learnify</span></h1>
    <p class="tagline">("Empowering minds, one lesson at a time")</p>
    
    <img src="stdstudy.jpg" alt="Books Image">
    
    <button onclick="goToNextPage()">Get Started</button>

    <footer>
        <p>© 2025 Learnify. All rights reserved.</p>
    </footer>
    
    <script>
        function goToNextPage() {
            window.location.href = 'login.html'; // Redirect to the login page
        }
    </script>
</body>
</html>
