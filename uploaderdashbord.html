<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uploader Dashboard - Learnify</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #1e6e72, #2a5298);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 90%;
            max-width: 500px;
        }

        h1 {
            color: #062d46;
            margin-bottom: 20px;
        }

        select, input, button {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            background-color: #062d46;
            color: white;
            border: none;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #2980b9;
        }

        .logout {
            background: #4d0e0e;
            margin-top: 15px;
        }

        .logout:hover {
            background: #b52121;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Upload Study Material</h1>

        <form id="uploadForm" action="UploadServlet" method="POST" enctype="multipart/form-data">
            <select name="category" required>
                <option value="">Select Category</option>
                <option value="study_material">Study Material</option>
                <option value="previous_year_paper">Previous Year Paper</option>
                <option value="ppt">Power Point Presentation</option>
            </select>
            
            <input type="text" name="subject" placeholder="Enter Subject Name" required>
            
            <input type="file" name="file" accept=".pdf,.ppt,.pptx,.doc,.docx,.jpg,.png" required>
            
            <button type="submit">Upload</button>
        </form>

        <button class="logout" onclick="redirectToHome()">Logout</button>
    </div>

    <script>
        function redirectToHome() {
            window.location.href = "index.html";
        }
    </script>
    
</body>
</html>
