<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Subject - Learnify</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        h1 {
            color: #2c3e50;
            margin-top: 20px;
        }
        .subject-list {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 40px;
        }
        .subject-card {
            background-color: #062d46;
            color: white;
            padding: 20px;
            margin: 10px;
            border-radius: 8px;
            cursor: pointer;
            width: 150px;
            text-align: center;
        }
        .subject-card:hover {
            background-color: #2980b9;
        }
        footer {
            background-color: #062d46;
            color: white;
            text-align: center;
            padding: 10px;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <h1>Choose a Subject</h1>
    <div class="subject-list">
        <div class="subject-card" onclick="goToSubject('Hindi')">Hindi</div>
        <div class="subject-card" onclick="goToSubject('English')">English</div>
        <div class="subject-card" onclick="goToSubject('Mathematics')">Mathematics</div>
        <div class="subject-card" onclick="goToSubject('Chemistry')">Chemistry</div>
        <div class="subject-card" onclick="goToSubject('Physics')">Physics</div>
    </div>

    <footer>
        <p>© 2025 Learnify. All Rights Reserved.</p>
    </footer>

    <script>
        function goToSubject(subject) {
            window.location.href = 'subject_details.html?subject=' + subject;
        }
    </script>
</body>
</html>
