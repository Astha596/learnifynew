<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learner Login - Learnify</title>
    <style>
        /* General Styling */
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #1e6e72, #2a5298);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        h1 { 
            color: #062d46; 
            margin-bottom: 20px; 
        }

        .input-field {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #062d46;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover { 
            background-color: #2980b9; 
        }

        .toggle-btn {
            background: none;
            color: #062d46;
            border: none;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
            text-decoration: underline;
        }

        .footer a {
            color: #2980b9;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="formTitle">Learner Login</h1>

        <!-- Login Form -->
        <form id="loginForm">
            <input type="email" class="input-field" placeholder="Enter your email" required>
            <input type="password" class="input-field" placeholder="Enter your password" required>
            <button type="button" onclick="redirectToDashboard()">Login</button>
            <p><a href="#">Forgot Password?</a></p>
            <p>Don't have an account? <button type="button" class="toggle-btn" onclick="toggleForm()">Sign Up</button></p>
        </form>

        <!-- Sign-Up Form (Hidden by Default) -->
        <form id="signupForm" style="display: none;">
            <input type="text" class="input-field" placeholder="Full Name" required>
            <input type="email" class="input-field" placeholder="Email Address" required>
            <input type="password" class="input-field" placeholder="Password" required>
            <input type="password" class="input-field" placeholder="Confirm Password" required>
            <button type="button" onclick="redirectToDashboard()">Sign Up</button>
            <p>Already have an account? <button type="button" class="toggle-btn" onclick="toggleForm()">Login</button></p>
        </form>
    </div>

    <script>
        function toggleForm() {
            let loginForm = document.getElementById("loginForm");
            let signupForm = document.getElementById("signupForm");
            let formTitle = document.getElementById("formTitle");

            if (loginForm.style.display === "none") {
                loginForm.style.display = "block";
                signupForm.style.display = "none";
                formTitle.innerText = "Learner Login";
            } else {
                loginForm.style.display = "none";
                signupForm.style.display = "block";
                formTitle.innerText = "Learner Sign Up";
            }
        }

        function redirectToDashboard() {
            window.location.href = "learnerdashbord.html";
        }
    </script>

</body>
</html>
